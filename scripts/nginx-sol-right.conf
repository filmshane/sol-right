# SOL-RIGHT Solar — LAN demo site on dedicated IP 192.168.1.210
server {
    listen 192.168.1.210:80;
    server_name sol-right.local 192.168.1.210;

    root /opt/sol-right/website;
    index index.html;

    access_log /var/log/nginx/sol-right.access.log;
    error_log  /var/log/nginx/sol-right.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8791/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
