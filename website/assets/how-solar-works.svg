<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="How rooftop solar works">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d3b66"/>
      <stop offset="100%" stop-color="#1b6ca8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3bf"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0b2a4a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd166"/>
    </marker>
  </defs>
  <rect width="960" height="340" rx="18" fill="url(#sky)"/>
  <text x="28" y="42" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">How rooftop solar works</text>
  <text x="28" y="68" fill="rgba(255,255,255,0.8)" font-family="Segoe UI, Arial, sans-serif" font-size="13">Sunlight → panels → inverter → your home (extras may go to the grid under utility rules)</text>

  <!-- Sun -->
  <circle cx="120" cy="170" r="46" fill="url(#sun)"/>
  <g stroke="#ffd166" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="100" x2="120" y2="112"/>
    <line x1="120" y1="228" x2="120" y2="240"/>
    <line x1="50" y1="170" x2="62" y2="170"/>
    <line x1="178" y1="170" x2="190" y2="170"/>
    <line x1="70" y1="120" x2="80" y2="130"/>
    <line x1="160" y1="210" x2="170" y2="220"/>
    <line x1="70" y1="220" x2="80" y2="210"/>
    <line x1="160" y1="130" x2="170" y2="120"/>
  </g>
  <text x="120" y="270" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1. Sunshine</text>
  <text x="120" y="290" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Segoe UI, Arial, sans-serif" font-size="11">Best on S / SW faces</text>

  <line x1="175" y1="170" x2="245" y2="170" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Roof panels -->
  <rect x="260" y="120" width="150" height="100" rx="10" fill="#3a241c"/>
  <g>
    <rect x="275" y="135" width="36" height="22" rx="2" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="317" y="135" width="36" height="22" rx="2" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="359" y="135" width="36" height="22" rx="2" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="275" y="165" width="36" height="22" rx="2" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="317" y="165" width="36" height="22" rx="2" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35"/>
    <rect x="359" y="165" width="36" height="22" rx="2" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35"/>
  </g>
  <text x="335" y="270" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2. Solar panels</text>
  <text x="335" y="290" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Segoe UI, Arial, sans-serif" font-size="11">Make DC electricity</text>

  <line x1="420" y1="170" x2="490" y2="170" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Inverter -->
  <rect x="510" y="130" width="110" height="80" rx="12" fill="#0f6e56" stroke="#7dffa6" stroke-width="2"/>
  <text x="565" y="168" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Inverter</text>
  <text x="565" y="190" text-anchor="middle" fill="#c8ffe0" font-family="Segoe UI, Arial, sans-serif" font-size="12">DC → AC</text>
  <text x="565" y="270" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3. Convert</text>
  <text x="565" y="290" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Segoe UI, Arial, sans-serif" font-size="11">Home-ready power</text>

  <line x1="630" y1="170" x2="700" y2="170" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Home -->
  <path d="M720 190 L780 140 L840 190 V240 H720 Z" fill="#f2efe8"/>
  <rect x="755" y="200" width="30" height="40" fill="#0d3b66"/>
  <rect x="730" y="200" width="18" height="18" fill="#7ec8e3"/>
  <rect x="812" y="200" width="18" height="18" fill="#7ec8e3"/>
  <text x="780" y="270" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">4. Your home</text>
  <text x="780" y="290" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Segoe UI, Arial, sans-serif" font-size="11">Use power first</text>

  <!-- Grid note -->
  <rect x="880" y="145" width="55" height="55" rx="8" fill="rgba(255,255,255,0.12)" stroke="#ffd166"/>
  <text x="907" y="178" text-anchor="middle" fill="#ffd166" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Grid</text>
  <line x1="845" y1="170" x2="875" y2="170" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="907" y="270" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Extras</text>
  <text x="907" y="290" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Segoe UI, Arial, sans-serif" font-size="10">Utility rules</text>
</svg>
